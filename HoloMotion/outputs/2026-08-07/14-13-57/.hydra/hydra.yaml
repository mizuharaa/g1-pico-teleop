hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - headless=true
    - record_video=false
    - use_gpu=false
    - dump_npzs=true
    - calc_per_clip_metrics=true
    - generate_report=true
    - ray_actors_per_gpu=2
    - ray_metrics_postprocess_num_cpus=2
    - metrics_threadpool_max_workers=4
    - +model_type=holomotion
    - +ckpt_onnx_path=/home/alois/full-body-teleoperation/artifacts/extracted/opt/holomotion/deployment/unitree_g1_ros2_29dof/install/humanoid_control/share/humanoid_control/models/HoloMotion_motion_tracking_model_v1.4.0/exported/model_14000.onnx
    - +motion_npz_path=/home/alois/full-body-teleoperation/artifacts/extracted/opt/holomotion/deployment/unitree_g1_ros2_29dof/install/humanoid_control/share/humanoid_control/motion_data/qinghai_v1_4_0.npz
    - robot_xml_path=assets/robots/unitree/G1/29dof/scene_29dof.xml
  job:
    name: eval_mujoco_sim2sim
    chdir: null
    override_dirname: +ckpt_onnx_path=/home/alois/full-body-teleoperation/artifacts/extracted/opt/holomotion/deployment/unitree_g1_ros2_29dof/install/humanoid_control/share/humanoid_control/models/HoloMotion_motion_tracking_model_v1.4.0/exported/model_14000.onnx,+model_type=holomotion,+motion_npz_path=/home/alois/full-body-teleoperation/artifacts/extracted/opt/holomotion/deployment/unitree_g1_ros2_29dof/install/humanoid_control/share/humanoid_control/motion_data/qinghai_v1_4_0.npz,calc_per_clip_metrics=true,dump_npzs=true,generate_report=true,headless=true,metrics_threadpool_max_workers=4,ray_actors_per_gpu=2,ray_metrics_postprocess_num_cpus=2,record_video=false,robot_xml_path=assets/robots/unitree/G1/29dof/scene_29dof.xml,use_gpu=false
    id: ???
    num: ???
    config_name: evaluation/eval_mujoco_sim2sim
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.5
    version_base: '1.3'
    cwd: /home/alois/full-body-teleoperation/HoloMotion
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/alois/full-body-teleoperation/HoloMotion/holomotion/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/alois/full-body-teleoperation/HoloMotion/outputs/2026-08-07/14-13-57
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
